# TLS terminates upstream; this forwards .php to php-fpm in the same container.

# A TLS-terminating proxy says so in X-Forwarded-Proto. No header means a direct
# plain-HTTP hit (the self-host example's port mapping), which must not claim
# to be secure or every generated URL points at a port that isn't serving TLS.
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    ~*^https on;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Written by `ghar:proxy-config` on every start from TRUSTED_PROXIES. With
    # `cloudflare` in the list it takes the client IP from CF-Connecting-IP;
    # otherwise it is empty and Laravel reads X-Forwarded-For itself.
    include /run/nginx/real-ip.conf;

    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Sourcemaps exist in the image for error-tracker upload; never serve them.
    # Regex locations lose to the ^~ prefix below, so this one is nested in it.

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        location ~ \.map$ {
            return 404;
        }
    }


    # A stale worker sticks users on old code until the cache expires.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # In Cloudflare mode the real_ip rewrite moves REMOTE_ADDR outside Symfony's
        # trusted proxies, so X-Forwarded-Proto would be ignored and http:// would leak
        # into x-inertia-location. Setting HTTPS from the map above sidesteps that.
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_read_timeout 60s;
    }

    # Deny hidden files (.env, .git, .htaccess) — also blocked by .dockerignore
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Below Cloudflare's 100 MB free-tier cap and StoreMediaRequest's 100 MB ceiling,
    # so anything that passes here reaches the validator. Must move together with
    # post_max_size and upload_max_filesize in docker/php/php.ini.
    client_max_body_size 96M;
}
