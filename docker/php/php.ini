; Ghar production PHP overrides.
; These layer on top of the alpine php-fpm defaults.

; Logging — surfaces to docker logs via stderr
log_errors = On
error_log = /dev/stderr
display_errors = Off
display_startup_errors = Off
expose_php = Off

; Production tuning — body-size lockstep with docker/nginx/default.conf:client_max_body_size
; Both MUST be 96M (iPhone HEVC camera-roll uploads need this headroom).
; CF free tier hard caps at 100M; we sit 4M below that for header overhead.
; StoreMediaRequest enforces the 100MB video ceiling at the validator layer.
memory_limit = 256M
post_max_size = 96M
upload_max_filesize = 96M
max_execution_time = 60

; OPcache — the single biggest perf win for PHP-FPM under load
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.jit_buffer_size = 64M
opcache.jit = tracing

