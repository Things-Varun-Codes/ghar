; supervisord — process supervisor for the Ghar app container.
;
; Runs four processes side-by-side:
;   - php-fpm      (FastCGI on 127.0.0.1:9000)
;   - nginx        (HTTP on :80, proxies .php to php-fpm)
;   - queue-worker (php artisan queue:work — processes queued notifications/jobs)
;   - scheduler    (php artisan schedule:work — fires routes/console.php cron entries)
;
; All four log to /dev/stdout + /dev/stderr so docker logs (and your host) see
; everything. If any process exits with a non-zero status, supervisord
; restarts it; if any dies repeatedly, supervisord exits, the container
; exits, Docker restarts it per the compose `restart: unless-stopped`.
;
; The container runs as www-data, so no program here sets `user`: a non-root
; supervisord aborts at startup if `user = root` is present.

[supervisord]
nodaemon = true
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = php-fpm -F
autostart = true
autorestart = true
priority = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g 'daemon off;'
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Notify-dispatched notifications queue here; without this program the jobs table grows forever.
; History thumb/medium WebP conversions also run here (->queued()).
; GD decodes the full bitmap of a large iPhone photo into memory, so the worker runs
; with `php -d memory_limit=512M` (php-fpm stays lean at 256M — see docker/php/php.ini).
; --memory=480 restarts the worker after a job that leaves RSS above ~480M, reclaiming
; leaked memory while leaving headroom below the 512M hard limit for the next job.
[program:queue-worker]
process_name=%(program_name)s
command=php -d memory_limit=512M /var/www/html/artisan queue:work --tries=3 --backoff=10 --sleep=3 --max-time=3600 --memory=480
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=3600
priority=15

; Drives routes/console.php scheduled commands — most importantly
; history:prune-media (R2 orphan reaper, dailyAt 03:00). Without a process
; running schedule:work the reaper NEVER fires and soft-deleted Event media
; accumulate in R2 forever. Mirrors the queue-worker block (www-data, restart).
[program:scheduler]
process_name=%(program_name)s
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
