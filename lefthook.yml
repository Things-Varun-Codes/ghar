# Local verification, run before CI sees the push. `npm run dev-setup` installs
# these. .github/workflows/ci.yml runs the same checks on every pull request;
# the audits, clean-tree check and smoke-loadmore run only here.

# Runs on `git commit`. Parallel — three independent linters on staged files only.
# Pint fixes the staged PHP files and `stage_fixed` restages them, so the commit
# carries the formatted version (lefthook hides unstaged hunks meanwhile).
pre-commit:
  parallel: true
  commands:
    pint:
      glob: "*.php"
      run: ./vendor/bin/pint {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,js,jsx,css,md,json}"
      run: npx prettier --check {staged_files}
    eslint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint {staged_files}

# Runs on `git push` against any branch. Piped: commands run in order and the
# first non-zero exit aborts the push. Cheapest signal first.
pre-push:
  piped: true
  commands:
    clean-tree:
      # Every check below runs against the working tree, not the commits being
      # pushed — so uncommitted or untracked changes could make a broken push
      # pass. Stash or commit them first.
      run: |
        git diff --quiet HEAD && test -z "$(git ls-files --others --exclude-standard)" || {
          echo "Working tree is not clean — commit or stash changes before pushing, so the checks test what is pushed." >&2
          git status --short >&2
          exit 1
        }
    env-deploy-sync:
      # Bidirectional diff: .env.example ↔ DEPLOY.md ```env block. A push that adds
      # a new env var without documenting it in DEPLOY.md fails here.
      run: ./scripts/check-env-deploy-sync.sh
    composer-audit:
      run: composer audit --locked --no-interaction --abandoned=ignore
    npm-audit:
      # Runtime-dep CVE gate. `--audit-level=high` ignores low/moderate noise;
      # `--omit=dev` scopes to runtime deps, matching composer-audit.
      run: npm audit --audit-level=high --omit=dev
    bare-catch-grep:
      # Fails on empty-body `catch (\Throwable …) { }` in app/. Complements the
      # frontend ESLint rule local/no-silent-error.
      run: ./scripts/check-bare-catch.sh
    boundaries:
      run: ./scripts/check-boundaries.sh
    smoke-routes:
      # Diffs live authenticated GET routes against scripts/smoke.mjs's routes
      # array so the smoke harness can't drift from the route table.
      run: node scripts/check-smoke-routes.mjs
    pint:
      # Repo-wide PHP style check (pre-commit only sees staged files).
      run: ./vendor/bin/pint --test
    types-check:
      # Wayfinder's generated routes/actions are gitignored and otherwise only
      # regenerated by `vite build` (inside smoke, last) — regenerate first so
      # tsc never checks against stale route helpers. `--with-form` matches
      # `formVariants: true` in vite.config.ts.
      run: php artisan wayfinder:generate --with-form --quiet && npm run types:check
    lint-check:
      # Full-repo eslint; pre-commit only lints staged files.
      run: npm run lint:check
    unit-tests:
      run: npm test
    larastan:
      run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
    phpunit:
      run: php artisan test
    smoke:
      # Rebuilds the Vite bundle before walking every route in both themes.
      run: npm run smoke
    smoke-loadmore:
      # Fault-injection smoke for the Mode-A load-more retry path. Runs only
      # when the push touches cursor pagination or the list footer.
      glob:
        - "resources/js/Shell/Hooks/useCursorPagination.ts"
        - "resources/js/Shell/Components/ListLoadMoreState.tsx"
        - "resources/js/MiniApps/Corner/Components/ListPage.tsx"
        - "resources/js/MiniApps/Mailbox/Components/MailboxListPage.tsx"
        - "app/Shell/Support/CursorList.php"
        - "app/Shell/Support/CursorPayload.php"
        - "scripts/loadmore-smoke.mjs"
      run: npm run smoke-loadmore
