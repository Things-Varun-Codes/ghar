# Local checks. `npm run dev-setup` installs these hooks. Pre-push is a fast
# gate; the full set (PHPUnit, static analysis, the build, both smoke runs, the
# audits) runs in .github/workflows/ci.yml on every pull request and is required
# before merge. `npm run verify` runs that full set locally.

# Runs on `git commit`. Parallel — three independent linters on staged files only.
# Pint fixes the staged PHP files and `stage_fixed` restages them, so the commit
# carries the formatted version (lefthook hides unstaged hunks meanwhile).
pre-commit:
  parallel: true
  commands:
    pint:
      glob: '*.php'
      run: ./vendor/bin/pint {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{ts,tsx,js,jsx,css,md,json}'
      run: npx prettier --check {staged_files}
    eslint:
      glob: '*.{ts,tsx,js,jsx}'
      run: npx eslint --cache --cache-strategy content --cache-location node_modules/.cache/eslint/ {staged_files}

# Runs on `git push` against any branch, and must stay quick: git opens the
# connection before the hook runs, and GitHub drops it if the hook takes minutes.
# The clean-tree check runs first, then the rest in parallel. Formatting covers
# only the files being pushed; eslint and tsc cover the whole repo through their
# caches in node_modules/.cache (CI runs both without a cache).
pre-push:
  piped: true
  jobs:
    - name: clean-tree
      # The checks run against the working tree, not the commits being pushed,
      # so uncommitted or untracked changes could make a broken push pass.
      run: |
        git diff --quiet HEAD && test -z "$(git ls-files --others --exclude-standard)" || {
          echo "Working tree is not clean — commit or stash changes before pushing, so the checks test what is pushed." >&2
          git status --short >&2
          exit 1
        }
    - name: checks
      group:
        parallel: true
        jobs:
          - name: env-deploy-sync
            # .env.example and the DEPLOY.md env block must list the same variables.
            run: ./scripts/check-env-deploy-sync.sh
          - name: bare-catch
            # Empty `catch (\Throwable …) { }` in app/; ESLint's local/no-silent-error covers the frontend.
            run: ./scripts/check-bare-catch.sh
          - name: boundaries
            run: ./scripts/check-boundaries.sh
          - name: smoke-routes
            # Every authenticated GET route is in scripts/smoke.mjs or on its skip-list.
            run: node scripts/check-smoke-routes.mjs
          - name: change-files
            # Every file in .changes/ parses, so a release can't fail on one later.
            run: node scripts/release.mjs check
          - name: pint
            glob: '*.php'
            run: ./vendor/bin/pint --test {push_files}
          - name: prettier
            glob: '*.{ts,tsx,js,jsx,css,md,json}'
            run: npx prettier --check {push_files}
          - name: eslint
            run: npx eslint . --cache --cache-strategy content --cache-location node_modules/.cache/eslint/
          - name: types
            # Wayfinder's routes are gitignored and otherwise only regenerated by
            # `vite build`; `--with-form` matches `formVariants: true` in vite.config.ts.
            run: php artisan wayfinder:generate --with-form --quiet && npx tsc --noEmit --incremental --tsBuildInfoFile node_modules/.cache/tsc/tsbuildinfo
