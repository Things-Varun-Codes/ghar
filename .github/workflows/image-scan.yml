name: Image scan

# A released image keeps its Alpine and PHP packages as they were on build day.
# This checks the latest one every week and lists fixable vulnerabilities under
# Security, Code scanning. A finding there usually means: cut a patch release.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: pull
        run: |
          if docker pull "$IMAGE"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No released image at $IMAGE yet; nothing to scan."
          fi
      - id: scan
        if: steps.pull.outputs.found == 'true'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          fail-build: false
          severity-cutoff: high
          only-fixed: true
      - if: steps.pull.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image
