name: Change file

# The pull request title becomes the commit on main, and a `feat` or `fix` is
# something a household notices, so it has to bring its changelog entry with it
# (.changes/README.md). `edited` is here so fixing the title re-runs the check;
# it is a workflow of its own so that an edit doesn't re-run the whole of CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: change-file-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check compares the base and the head, so it needs both histories.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: node scripts/release.mjs check --pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
